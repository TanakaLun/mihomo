# TUN 内核级 CIDR 旁路配置示例（Windows / Linux）
# 目的：geoip-cn 等"永远直连"的 CIDR 在内核层面绕过 TUN，不进入 mihomo 用户态。
# 平台差异：DNS 联动（fake-ip -> 真实 IP）所有平台生效；
#           物理旁路路由仅在 Windows 生效（Linux TUN 侧默认无，可用 eBPF 入站）。

mixed-port: 7890
mode: rule
allow-lan: false
log-level: info
ipv6: false

# 规则提供者：route-exclude-address-set 要求 behavior 为 ipcidr 或 classical
# （ipcidr 整体提取；classical 提取其中的 IP-CIDR 规则）。
rule-providers:
  geoip-cn:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@sing/geoip/cn.txt"
    path: ./ruleset/geoip-cn.txt
    interval: 86400
  # geoip-lan:
  #   type: local
  #   behavior: ipcidr
  #   path: ./ruleset/geoip-lan.txt

tun:
  enable: true
  stack: mixed          # gvisor / mixed / system
  dns-hijack:
    - any:53
  auto-route: true      # ❗ 必须开启：TUN 接管默认路由，Windows 旁路路由才有意义
  # auto-detect-interface: true   # 自动选物理出口，推荐
  # strict-route: true            # 可选；当前 WFP 过滤器不与旁路冲突

  # 规则集驱动的内核级旁路（本特性）：route-exclude-address-set 是旁路的
  # 唯一规则集来源（旧版 bypass-rule-set 已合并进这里）
  route-exclude-address-set:
    - geoip-cn
    # - geoip-lan

  # 静态 CIDR 直连：所有平台生效（含 Windows）。与 route-exclude-address-set 叠加生效。
  route-exclude-address:
    - 100.64.0.0/10      # Tailscale tailnet 等 CGNAT 走物理网卡
  # route-address:        # 自定义 TUN 路由表（避免出现与旁路前缀"一样宽"的覆盖）
  #   - 0.0.0.0/1
  #   - 128.0.0.0/1

  # ⚠️ 以下为 Linux 专用选项，与内核旁路无关（route-exclude-address-set 在
  # Windows 上同时驱动物理旁路路由）：
  # route-address-set: []          # 仅 Linux + nftables + auto-redirect
  # auto-redirect: false

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip     # fake-ip：命中旁路集合的域名自动回真实 IP（DNS 联动）
                             # redir-host：天然返回真实 IP，无需联动
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies:
  - name: "proxy"
    type: ss
    server: example.com
    port: 8388
    cipher: aes-128-gcm
    password: "change-me"

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - proxy
      - DIRECT

rules:
  # 旁路集合（geoip-cn）里的流量不会进入 mihomo，直接内核直连；
  # 下面的 DOMAIN-SUFFIX/GEOIP 是给"不旁路"的流量用的兜底规则。
  - GEOIP,CN,DIRECT
  - MATCH,PROXY