name: Build TUN bypass branch

on:
  push:
    branches:
      - feat/win-tun-route-bypass
      - "automation/tun-bypass-*"
  pull_request:
    branches:
      - feat/win-tun-route-bypass
      - Alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-tun-bypass-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKIP_INTEROP_TEST: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -count=1

      - name: Test bypass pipeline with with_gvisor
        shell: bash
        run: |
          set -euo pipefail
          # These packages carry the TUN kernel bypass (route reconcile, DNS
          # fake-ip linkage, bypass registry). The Windows physical-route code
          # is compiled below by the cross builds; on linux it is compiled out.
          go test -count=1 -tags "with_gvisor" ./component/route/... ./component/bypass/... ./listener/sing_tun/... ./dns/...

  build:
    needs:
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # TUN bypass primary target: Windows amd64 (physical route install).
          - goos: windows
            goarch: amd64
            goamd64: v3
            target: windows-amd64-v3
          - goos: linux
            goarch: amd64
            goamd64: v3
            target: linux-amd64-v3
          - goos: linux
            goarch: arm64
            target: linux-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: |
          go mod download

      - name: Record build metadata
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist build
          git fetch --depth=1 https://github.com/MetaCubeX/mihomo.git Alpha
          echo "$(git rev-parse FETCH_HEAD)" > build/UPSTREAM_SHA
          echo "$(git rev-parse HEAD)" > build/COMMIT_SHA
          echo "${GOOS}/${GOARCH}" > build/PLATFORM
          go version > build/GO_VERSION
          version="$(git describe --tags --always --abbrev=12)"
          echo "${version}" > build/VERSION
          echo "version=${version}" >> "$GITHUB_ENV"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"
          output="dist/mihomo-tun-bypass-${GOOS}-${GOARCH}${ext}"
          CGO_ENABLED=0 go build -v -tags "with_gvisor" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${version}' \
                      -X 'github.com/metacubex/mihomo/constant.BuildTime=${build_time}' \
                      -w -s -buildid=" \
            -o "${output}" .
          sha256sum "${output}" > "${output}.sha256"
          cp build/* dist/

      - uses: actions/upload-artifact@v7
        with:
          name: mihomo-tun-bypass-${{ matrix.target }}
          path: |
            dist/*
            build/*
          if-no-files-found: error

  cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Build inline (compile check only)
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags with_gvisor -trimpath -o /dev/null .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -tags with_gvisor -trimpath -o /dev/null .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags with_gvisor -trimpath -o /dev/null .
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -tags with_gvisor -trimpath -o /dev/null .

  release:
    needs: build
    # Only push-triggered builds publish the rolling prerelease; manual
    # (workflow_dispatch) and pull_request runs build artifacts only.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v1.19.22-tun-bypass
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="${{ github.sha }}"
          commit_msg="$(git log -1 --format=%s "$commit_sha" 2>/dev/null || git log -1 --format=%s)"
          upstream_sha="$(sed -n '1p' "$(find artifacts -path '*/build/UPSTREAM_SHA' | head -1)")"
          version="$(sed -n '1p' "$(find artifacts -path '*/build/VERSION' | head -1)")"
          {
            echo "## 本次构建"
            echo "- 触发: ${{ github.event_name }} (${{ github.ref }})"
            echo "- 提交: \`${commit_sha}\` — ${commit_msg}"
            echo "- 上游 Alpha: \`${upstream_sha}\`"
            echo "- 版本: \`${version}\`"
            echo
            echo "## 二进制"
            for f in $(find artifacts -type f -name 'mihomo-tun-bypass-*' ! -name '*.sha256' | sort); do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              sha="$(sha256sum "$f" | awk '{print $1}')"
              echo "- \`${name}\`: ${sha}"
            done
          } > notes.md

      - name: Create or update rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --title "mihomo Meta — TUN route-exclude bypass (${RELEASE_TAG})" \
            --notes-file notes.md \
            --prerelease || true
          gh release edit "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --notes-file notes.md || true

      - name: Upload assets (deduped, clobber)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f \
            \( -name 'mihomo-tun-bypass-*' -o -name '*.sha256' \) | sort -u)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no build assets found" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --clobber