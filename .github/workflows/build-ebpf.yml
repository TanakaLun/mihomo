name: Build eBPF branch

on:
  push:
    branches:
      - ebpf-inbound
      - "automation/ebpf-*"
  pull_request:
    branches:
      - ebpf-inbound
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ebpf-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKIP_INTEROP_TEST: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -count=1

      - name: Test eBPF packages
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -tags "with_gvisor with_ebpf" ./listener/sing_ebpf/...

  build:
    needs:
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goamd64: v3
          - goos: linux
            goarch: arm64
          - goos: android
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: |
          go mod download

      - name: Record build metadata
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist build
          git fetch --depth=1 https://github.com/MetaCubeX/mihomo.git Alpha
          echo "$(git rev-parse FETCH_HEAD)" > build/UPSTREAM_SHA
          echo "$(git rev-parse HEAD)" > build/COMMIT_SHA
          echo "${GOOS}/${GOARCH}" > build/PLATFORM
          go version > build/GO_VERSION
          version="$(git describe --tags --always --abbrev=12)"
          echo "${version}" > build/VERSION
          echo "version=${version}" >> "$GITHUB_ENV"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        shell: bash
        run: |
          set -euo pipefail
          output="dist/mihomo-ebpf-${GOOS}-${GOARCH}"
          # The cilium/ebpf backend is pure Go; CGO_ENABLED=0 yields a fully
          # static binary on every target without a separate static variant.
          CGO_ENABLED=0 go build -v -tags "with_gvisor with_ebpf" -trimpath             -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${version}'                       -X 'github.com/metacubex/mihomo/constant.BuildTime=${build_time}'                       -w -s -buildid="             -o "${output}" .
          sha256sum "${output}" > "${output}.sha256"
          cp build/* dist/

      - uses: actions/upload-artifact@v7
        with:
          name: mihomo-ebpf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*
            build/*
          if-no-files-found: error

  eBPF-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Build eBPF adapter
        run: |
          set -euo pipefail
          go mod download
          CGO_ENABLED=0 go build -tags "with_gvisor with_ebpf" -trimpath -o /dev/null ./listener/sing_ebpf/...

  cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Build non-eBPF platforms
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags with_gvisor -trimpath -o mihomo-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags with_gvisor -trimpath -o mihomo-darwin-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags with_gvisor -trimpath -o mihomo-linux-noebpf .
  release:
    needs: build
    # Only push-triggered builds publish the rolling prerelease; manual
    # (workflow_dispatch) and pull_request runs build artifacts only.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v1.19.22-ebpf
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="${{ github.sha }}"
          commit_msg="$(git log -1 --format=%s "$commit_sha" 2>/dev/null || git log -1 --format=%s)"
          upstream_sha="$(sed -n '1p' "$(find artifacts -path '*/build/UPSTREAM_SHA' | head -1)")"
          version="$(sed -n '1p' "$(find artifacts -path '*/build/VERSION' | head -1)")"
          {
            echo "## 本次构建"
            echo "- 触发: ${{ github.event_name }} (${{ github.ref }})"
            echo "- 提交: \`${commit_sha}\` — ${commit_msg}"
            echo "- 上游 Alpha: \`${upstream_sha}\`"
            echo "- 版本: \`${version}\`"
            echo
            echo "## 二进制"
            for f in $(find artifacts -type f -name 'mihomo-ebpf-*' ! -name '*.sha256' | sort); do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              sha="$(sha256sum "$f" | awk '{print $1}')"
              echo "- \`${name}\`: ${sha}"
            done
          } > notes.md

      - name: Create or update rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --title "mihomo Meta — eBPF inbound (${RELEASE_TAG})" \
            --notes-file notes.md \
            --prerelease || true
          gh release edit "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --notes-file notes.md || true

      - name: Upload assets (deduped, clobber)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f \
            \( -name 'mihomo-ebpf-*' -o -name '*.sha256' \) | sort -u)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no build assets found" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
