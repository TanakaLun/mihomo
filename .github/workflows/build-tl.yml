name: Build TL (eBPF + TUN bypass)

on:
  push:
    branches:
      - Alpha
      - "automation/tl-*"
  pull_request:
    branches:
      - Alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-tl-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SKIP_INTEROP_TEST: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -count=1

      - name: Test TUN bypass pipeline with with_gvisor
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -tags "with_gvisor" ./component/route/... ./component/bypass/... ./listener/sing_tun/... ./dns/...

      - name: Test eBPF packages with with_gvisor with_ebpf
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -tags "with_gvisor with_ebpf" ./listener/sing_ebpf/...

  build:
    needs:
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: ebpf
            goos: linux
            goarch: amd64
            goamd64: v3
            tags: "with_gvisor with_ebpf"
          - artifact: ebpf
            goos: linux
            goarch: arm64
            tags: "with_gvisor with_ebpf"
          - artifact: ebpf
            goos: android
            goarch: arm64
            tags: "with_gvisor with_ebpf"
          - artifact: tun-bypass
            goos: windows
            goarch: amd64
            goamd64: v3
            tags: "with_gvisor"
          - artifact: tun-bypass
            goos: linux
            goarch: amd64
            goamd64: v3
            tags: "with_gvisor"
          - artifact: tun-bypass
            goos: linux
            goarch: arm64
            tags: "with_gvisor"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: |
          go mod download

      - name: Record build metadata
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist build
          branch="${GITHUB_REF_NAME:-unknown}"
          branch="${branch//\//-}"
          short_sha="$(git rev-parse --short=8 HEAD)"
          version="${GITHUB_REPOSITORY_OWNER}-${branch}-${short_sha}"
          echo "${version}" > build/VERSION
          echo "version=${version}" >> "$GITHUB_ENV"
          echo "$(git rev-parse HEAD)" > build/COMMIT_SHA
          echo "${GOOS}/${GOARCH}" > build/PLATFORM
          go version > build/GO_VERSION
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"
          output="dist/mihomo-${{ matrix.artifact }}-${GOOS}-${GOARCH}${ext}"
          CGO_ENABLED=0 go build -v -tags "${{ matrix.tags }}" -trimpath \
            -ldflags "-X 'github.com/metacubex/mihomo/constant.Version=${version}' \
                      -X 'github.com/metacubex/mihomo/constant.BuildTime=${build_time}' \
                      -w -s -buildid=" \
            -o "${output}" .
          sha256sum "${output}" > "${output}.sha256"
          cp build/* dist/

      - uses: actions/upload-artifact@v7
        with:
          name: mihomo-${{ matrix.artifact }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*
            build/*
          if-no-files-found: error

  cross-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: ${{ env.GO_VERSION }}

      - name: Build inline
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -tags with_gvisor -trimpath -o /dev/null .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -tags with_gvisor -trimpath -o /dev/null .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags with_gvisor -trimpath -o /dev/null .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -tags with_gvisor -trimpath -o /dev/null .
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -tags with_gvisor -trimpath -o /dev/null .

  release:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Compute release tag
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(git ls-remote https://github.com/MetaCubeX/mihomo.git refs/heads/Alpha | awk '{print $1}')"
          if git rev-list --count "${upstream_sha}"..HEAD >/dev/null 2>&1; then
            lead="$(git rev-list --count "${upstream_sha}"..HEAD)"
          else
            git fetch --no-tags --filter=blob:none https://github.com/MetaCubeX/mihomo.git Alpha
            lead="$(git rev-list --count FETCH_HEAD..HEAD 2>/dev/null || echo 0)"
          fi
          echo "RELEASE_TAG=v1.19.33-${GITHUB_REPOSITORY_OWNER}-${lead}" >> "$GITHUB_ENV"

      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="${{ github.sha }}"
          commit_msg="$(git log -1 --format=%s "$commit_sha" 2>/dev/null || git log -1 --format=%s)"
          version="$(sed -n '1p' "$(find artifacts -path '*/build/VERSION' | head -1)")"
          {
            echo "## 本次构建"
            echo "- 触发: ${{ github.event_name }} (${{ github.ref }})"
            echo "- 提交: \`${commit_sha}\` — ${commit_msg}"
            echo "- 版本: \`${version}\`"
            echo
            echo "## 二进制"
            for f in $(find artifacts -type f \( -name 'mihomo-ebpf-*' -o -name 'mihomo-tun-bypass-*' \) ! -name '*.sha256' | sort); do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              sha="$(sha256sum "$f" | awk '{print $1}')"
              echo "- \`${name}\`: ${sha}"
            done
          } > notes.md

      - name: Create or update rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --title "${RELEASE_TAG}" \
            --notes-file notes.md \
            --prerelease || true
          gh release edit "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --notes-file notes.md || true

      - name: Upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find artifacts -type f \
            \( -name 'mihomo-ebpf-*' -o -name 'mihomo-tun-bypass-*' -o -name '*.sha256' \) | sort -u)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no build assets found" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
